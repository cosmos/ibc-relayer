services:
  postgres:
    image: postgres:18
    restart: always
    environment:
      POSTGRES_USER: relayer
      POSTGRES_PASSWORD: relayer
      POSTGRES_DB: relayer
    ports:
      - 42500:5432
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      - relayer
    healthcheck:
      test: pg_isready -U relayer -d relayer
      interval: 1s
      timeout: 3s
      retries: 30

networks:
  relayer:

volumes:
  pgdata:
